<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fayda — working prototype (buyer and seller apps)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --ink: #111318; --muted: #5B6170; --faint: #8A8F9A;
  --accent: #C2410C; --accent-strong: #9A3412; --accent-tint: #FFF7ED; --accent-tint-2: #FFEDD5; --on-accent: #FFFFFF;
  --border: #D5D8DE; --divider: #E3E5E9; --surface: #FFFFFF; --surface-2: #F1F2F4; --surface-3: #F7F7F8;
  --success: #047857; --success-tint: #DCFCE7; --danger: #B91C1C; --danger-tint: #FEE2E2; --info: #1E40AF; --info-tint: #DBEAFE;
  --dark-btn: #111318; --dark-btn-fg: #FFFFFF;
  --page: #E6E7EA; --page-ink: #111318; --frame: #1C1D21;
  --sheet-shadow: 0 -8px 30px rgba(17, 19, 24, .16);
  --r-sm: 10px; --r-md: 12px; --r-lg: 14px; --r-xl: 20px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #F2F3F5; --muted: #A6ABB5; --faint: #7D828C;
    --accent: #EA580C; --accent-strong: #FDBA74; --accent-tint: #2A1A10; --accent-tint-2: #3A2414;
    --border: #3A3D45; --divider: #2A2C32; --surface: #16171B; --surface-2: #22242A; --surface-3: #1C1D22;
    --success: #34D399; --success-tint: #0E2D22; --danger: #F87171; --danger-tint: #3A1717; --info: #93C5FD; --info-tint: #172554;
    --dark-btn: #F2F3F5; --dark-btn-fg: #111318;
    --page: #0B0C0F; --page-ink: #F2F3F5; --frame: #2A2C31;
    --sheet-shadow: 0 -8px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #F2F3F5; --muted: #A6ABB5; --faint: #7D828C;
  --accent: #EA580C; --accent-strong: #FDBA74; --accent-tint: #2A1A10; --accent-tint-2: #3A2414;
  --border: #3A3D45; --divider: #2A2C32; --surface: #16171B; --surface-2: #22242A; --surface-3: #1C1D22;
  --success: #34D399; --success-tint: #0E2D22; --danger: #F87171; --danger-tint: #3A1717; --info: #93C5FD; --info-tint: #172554;
  --dark-btn: #F2F3F5; --dark-btn-fg: #111318;
  --page: #0B0C0F; --page-ink: #F2F3F5; --frame: #2A2C31;
  --sheet-shadow: 0 -8px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; height: 100%; background: var(--page); color: var(--page-ink); font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#root { height: 100%; }

/* ---------- page shell ---------- */
.shell { height: 100%; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid color-mix(in srgb, var(--page-ink) 12%, transparent); flex-wrap: wrap; }
.topbar .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.topbar .brand b { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
.topbar .brand span { font-size: 12px; color: color-mix(in srgb, var(--page-ink) 62%, transparent); }
.topbar .group { display: flex; align-items: center; gap: 6px; }
.topbar .clock { font-size: 12px; color: color-mix(in srgb, var(--page-ink) 70%, transparent); white-space: nowrap; }
.tbtn { height: 32px; padding: 0 11px; border-radius: 9px; border: 1px solid color-mix(in srgb, var(--page-ink) 18%, transparent); background: transparent; color: var(--page-ink); font-size: 12px; font-weight: 700; white-space: nowrap; }
.tbtn:hover { background: color-mix(in srgb, var(--page-ink) 7%, transparent); }
.tbtn[aria-pressed="true"] { background: var(--page-ink); color: var(--page); border-color: var(--page-ink); }
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; gap: 36px; padding: 16px; overflow: auto; }
.device { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.device-label { font-size: 12px; font-weight: 700; color: color-mix(in srgb, var(--page-ink) 65%, transparent); }
.phone { position: relative; width: 390px; height: min(820px, calc(100dvh - 120px)); min-height: 560px; border-radius: 38px; border: 10px solid var(--frame); background: var(--surface); color: var(--ink); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0, 0, 0, .22); }
@media (max-width: 899px) { .topbar { flex-wrap: nowrap; overflow-x: auto; padding: 8px 10px; gap: 8px; scrollbar-width: none; } .topbar::-webkit-scrollbar { display: none; } .topbar .brand { margin-right: 4px; } .stage { gap: 0; padding: 0; } .device-label { display: none; } .device { width: 100%; height: 100%; } .phone { width: 100%; max-width: 480px; height: 100%; min-height: 0; border-radius: 0; border: 0; box-shadow: none; } .stage { align-items: stretch; } .hide-narrow { display: none !important; } }
@media (min-width: 900px) { .hide-wide { display: none !important; } }

/* ---------- inside the phone ---------- */
.envbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 14px; font-size: 11px; font-weight: 700; background: var(--accent-tint); color: var(--accent-strong); border-bottom: 1px solid var(--accent-tint-2); }
.body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.screen { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.page { position: absolute; inset: 0; z-index: 20; background: var(--surface); display: flex; flex-direction: column; }
.page .screen { flex: 1; }
.page > .screen { position: static; }
.appbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--divider); background: var(--surface); min-height: 58px; }
.appbar h1 { font-size: 17px; margin: 0; font-weight: 800; letter-spacing: -.2px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid var(--divider); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; position: relative; color: var(--ink); }
.iconbtn.plain { border-color: transparent; }
.dot { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.tabbar { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-top: 1px solid var(--divider); background: var(--surface); padding-bottom: 2px; }
.tab { background: none; border: 0; padding: 8px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--muted); position: relative; }
.tab[aria-current="page"] { color: var(--accent); }
.tab .dot { top: 2px; right: calc(50% - 22px); }
.pad { padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.h2 { font-size: 20px; font-weight: 800; letter-spacing: -.4px; margin: 0; }
.h3 { font-size: 15px; font-weight: 800; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.strong { font-weight: 800; }
.price { font-weight: 800; font-size: 17px; letter-spacing: -.2px; }
.strike { text-decoration: line-through; color: var(--faint); font-weight: 600; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.section-title { font-size: 13px; font-weight: 800; margin: 18px 0 8px; }
.divider { height: 1px; background: var(--divider); margin: 4px 0; }

/* buttons */
.btn { height: 48px; padding: 0 16px; border-radius: var(--r-lg); border: 1.5px solid transparent; font-weight: 750; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn.block { width: 100%; }
.btn.lg { height: 54px; font-size: 16px; }
.btn.sm { height: 38px; font-size: 13px; padding: 0 12px; border-radius: 11px; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.dark { background: var(--dark-btn); color: var(--dark-btn-fg); }
.btn.outline { background: var(--surface); color: var(--ink); border-color: var(--border); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { background: var(--surface); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* fields */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .label { font-size: 13px; font-weight: 700; }
.input { height: 50px; width: 100%; padding: 0 14px; border-radius: var(--r-md); border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); font-size: 16px; }
textarea.input { height: auto; min-height: 88px; padding: 12px 14px; resize: vertical; line-height: 1.4; }
.input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.input[aria-invalid="true"] { border-color: var(--danger); }
.input-group { display: flex; gap: 8px; }
.prefix { height: 50px; padding: 0 14px; border: 1.5px solid var(--border); border-radius: var(--r-md); display: flex; align-items: center; font-weight: 700; font-size: 16px; background: var(--surface-3); }
.hint { font-size: 12px; color: var(--muted); }
.error { font-size: 12px; color: var(--danger); font-weight: 600; }
.otp { letter-spacing: 12px; text-align: center; font-size: 24px; font-weight: 800; height: 58px; }

/* chips & segmented */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { height: 36px; padding: 0 13px; border-radius: 99px; border: 1.5px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--dark-btn); color: var(--dark-btn-fg); border-color: var(--dark-btn); }
.chip.accent[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent-strong); border-color: var(--accent); }
.chip:disabled { opacity: .4; text-decoration: line-through; cursor: not-allowed; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: var(--r-lg); }
.seg button { height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 700; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }

/* cards & misc */
.card { border: 1px solid var(--divider); border-radius: 16px; padding: 14px; background: var(--surface); }
.card.tint { background: var(--accent-tint); border-color: var(--accent-tint-2); }
.card.success { background: var(--success-tint); border-color: color-mix(in srgb, var(--success) 30%, transparent); }
.card.info { background: var(--info-tint); border-color: color-mix(in srgb, var(--info) 25%, transparent); }
.card.danger { background: var(--danger-tint); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 11px; font-weight: 800; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.accent { background: var(--accent-tint-2); color: var(--accent-strong); }
.badge.success { background: var(--success-tint); color: var(--success); }
.badge.danger { background: var(--danger-tint); color: var(--danger); }
.badge.info { background: var(--info-tint); color: var(--info); }
.badge.dark { background: var(--dark-btn); color: var(--dark-btn-fg); }
.choice { text-align: left; display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 18px; border: 2px solid var(--divider); background: var(--surface); color: var(--ink); width: 100%; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-tint); }
.choice .ic { flex: none; width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: var(--accent-tint-2); color: var(--accent-strong); }
.listrow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--divider); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; color: var(--ink); }
.listrow:hover { background: var(--surface-3); }
.thumb { flex: none; width: 56px; height: 56px; border-radius: 12px; overflow: hidden; position: relative; background: var(--surface-2); }
.thumb.lg { width: 72px; height: 72px; }
.empty { text-align: center; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty .ic { width: 56px; height: 56px; border-radius: 18px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--muted); margin-bottom: 4px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border: 1px solid var(--divider); border-radius: 14px; padding: 10px 12px; }
.stat b { display: block; font-size: 18px; letter-spacing: -.3px; }
.stat span { font-size: 11px; color: var(--muted); font-weight: 700; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border: 0; padding: 0; background: none; text-align: left; color: var(--ink); display: flex; flex-direction: column; gap: 6px; }
.tile .media { aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; position: relative; background: var(--surface-2); }
.avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--dark-btn); color: var(--dark-btn-fg); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
.avatar.lg { width: 56px; height: 56px; font-size: 20px; }
.timeline { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
.bubble { max-width: 82%; padding: 10px 13px; border-radius: 16px; font-size: 14px; line-height: 1.35; border: 1px solid var(--divider); background: var(--surface); }
.bubble.me { align-self: flex-end; background: var(--dark-btn); color: var(--dark-btn-fg); border-color: var(--dark-btn); border-bottom-right-radius: 4px; }
.bubble.them { align-self: flex-start; border-bottom-left-radius: 4px; }
.bubble .amt { font-size: 18px; font-weight: 800; letter-spacing: -.3px; display: block; }
.bubble .meta { font-size: 11px; opacity: .7; margin-top: 2px; display: block; }
.sysmsg { align-self: center; font-size: 12px; color: var(--muted); background: var(--surface-2); padding: 5px 10px; border-radius: 99px; text-align: center; max-width: 92%; }
.actionbar { flex: none; padding: 12px 14px; border-top: 1px solid var(--divider); background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.status-steps { display: flex; flex-direction: column; gap: 0; }
.status-steps .st { display: flex; gap: 12px; align-items: flex-start; padding-bottom: 14px; position: relative; }
.status-steps .st::before { content: ''; position: absolute; left: 9px; top: 20px; bottom: 0; width: 2px; background: var(--divider); }
.status-steps .st:last-child::before { display: none; }
.status-steps .pt { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface); position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; }
.status-steps .st.done .pt { background: var(--success); border-color: var(--success); color: #fff; }
.toast { position: absolute; left: 14px; right: 14px; top: 66px; z-index: 90; background: var(--dark-btn); color: var(--dark-btn-fg); padding: 12px 14px; border-radius: 14px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
.toast.err { background: var(--danger); color: #fff; }

/* sheets */
.scrim { position: absolute; inset: 0; z-index: 60; background: rgba(10, 11, 14, .45); display: flex; flex-direction: column; justify-content: flex-end; }
.sheet { background: var(--surface); color: var(--ink); border-radius: 22px 22px 0 0; max-height: 88%; display: flex; flex-direction: column; box-shadow: var(--sheet-shadow); }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 800; flex: 1; }
.sheet-body { overflow-y: auto; padding: 0 16px 16px; }
.grabber { width: 40px; height: 4px; border-radius: 99px; background: var(--border); margin: 8px auto 0; }
.dialog { position: absolute; inset: 0; z-index: 80; background: rgba(10, 11, 14, .5); display: flex; align-items: center; justify-content: center; padding: 22px; }
.dialog > div { background: var(--surface); color: var(--ink); border-radius: 20px; padding: 20px; width: 100%; display: flex; flex-direction: column; gap: 12px; }

/* reels */
.reels { position: absolute; inset: 0; overflow-y: auto; scroll-snap-type: y mandatory; background: #000; scrollbar-width: none; }
.reels::-webkit-scrollbar { display: none; }
.reel { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; color: #fff; }
.reel-media { position: absolute; inset: 0; }
.reel-shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, rgba(0, 0, 0, .45) 0%, rgba(0, 0, 0, 0) 22%, rgba(0, 0, 0, 0) 48%, rgba(0, 0, 0, .78) 100%); }
.reel-top { position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 12px; }
.reel-top .seg { background: rgba(255, 255, 255, .16); flex: 1; }
.reel-top .seg button { color: rgba(255, 255, 255, .82); height: 34px; font-size: 13px; }
.reel-top .seg button[aria-pressed="true"] { background: #fff; color: #111318; }
.glass { height: 38px; padding: 0 12px; border-radius: 99px; border: 0; background: rgba(255, 255, 255, .16); color: #fff; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; position: relative; }
.glass.round { width: 38px; padding: 0; justify-content: center; }
.rail { position: absolute; right: 10px; bottom: 150px; z-index: 3; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.rail button { background: none; border: 0; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; text-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
.rail .rail-ic { width: 44px; height: 44px; border-radius: 50%; background: rgba(0, 0, 0, .25); display: flex; align-items: center; justify-content: center; }
.reel-info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.reel-info .seller { display: flex; align-items: center; gap: 8px; }
.reel-info .seller .avatar { width: 34px; height: 34px; background: #fff; color: #111318; }
.reel-info .follow { height: 28px; padding: 0 10px; border-radius: 8px; border: 1.5px solid rgba(255, 255, 255, .8); background: transparent; color: #fff; font-size: 12px; font-weight: 800; }
.reel-info .follow[aria-pressed="true"] { background: rgba(255, 255, 255, .2); border-color: transparent; }
.reel-info .title { font-size: 16px; font-weight: 800; margin-right: 64px; text-shadow: 0 1px 4px rgba(0, 0, 0, .45); }
.reel-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.reel-badges .badge { background: rgba(255, 255, 255, .18); color: #fff; }
.reel-badges .badge.accent { background: var(--accent); color: #fff; }
.reel .btn-row .btn.outline { background: rgba(255, 255, 255, .95); color: #111318; border-color: transparent; }
.tap-target { position: absolute; inset: 64px 70px 210px 0; z-index: 2; background: transparent; border: 0; }
.seed-tag { position: absolute; z-index: 2; left: 10px; top: 60px; font-size: 10px; font-weight: 700; color: rgba(255, 255, 255, .8); background: rgba(0, 0, 0, .25); padding: 3px 7px; border-radius: 6px; }
.mute { position: absolute; z-index: 3; right: 12px; top: 60px; }

/* media */
.scene { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.scene svg.garment { width: 62%; max-width: 260px; filter: drop-shadow(0 18px 28px rgba(0, 0, 0, .28)); }
.scene.small svg.garment { width: 74%; }
.scene .drift { animation: drift 9s ease-in-out infinite alternate; }
@keyframes drift { from { transform: scale(1) translateY(0); } to { transform: scale(1.06) translateY(-8px); } }
@media (prefers-reduced-motion: reduce) { .scene .drift { animation: none; } }
.media-fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }

<script>
/* Fayda prototype engine — pure business rules, no DOM.
 * Mirrors FAYDA_PROJECT_FOUNDATION.md §3 (R1–R17). Values marked PROVISIONAL are not approved policy.
 * All money is integer paise. All times are epoch ms supplied by the caller (simulated clock).
 * Designed to move into apps/api (NestJS) as the negotiation/ordering domain modules. */
(function (root) {
  'use strict';

  const HOUR = 3600e3, DAY = 24 * HOUR;
  const RULES = Object.freeze({
    OFFER_MIN_RATIO: 0.10,                 // PROVISIONAL platform sanity floor (R2)
    MAX_OFFERS_PER_NEGOTIATION: 6,         // PROVISIONAL (R6)
    MAX_NEW_NEGOTIATIONS_PER_LISTING_24H: 3, // PROVISIONAL (R6)
    DEFAULT_EXPIRY_HOURS: 24, MIN_EXPIRY_HOURS: 6, MAX_EXPIRY_HOURS: 72, // PROVISIONAL (R7)
    AUTO_DECLINE_DELAY_MS: 2 * 60e3,       // PROVISIONAL (R8, §3.6)
    AUTO_COUNTER_DELAY_MS: 5e3,            // founder decision: automatic counters arrive after 5 s and look like the seller's own
    CHECKOUT_WINDOW_HOURS: 12,             // PROVISIONAL (R9)
    ORDER_CONFIRM_WINDOW_HOURS: 48,        // PROVISIONAL: seller must confirm a placed order or it expires
    MIN_PRICE_PAISE: 50 * 100, MAX_PRICE_PAISE: 1000000 * 100,
    DEV_OTP: '123456'                      // SIMULATED sign-in code
  });
  const CATEGORIES = ['Ethnic wear', 'Western wear', 'Menswear', 'Accessories', 'Footwear'];
  const MODES = ['FIXED', 'PRIVATE', 'PUBLIC', 'BOTH'];
  const ORDER_FLOW = ['PLACED', 'CONFIRMED', 'SHIPPED', 'DELIVERED'];
  const CANCEL_REASONS = { PAYMENT_NOT_RECEIVED: 'Payment not received', WEBSITE_ORDER_NOT_FOUND: 'No matching order on the website', OUT_OF_STOCK: 'Out of stock', BUYER_REQUEST: 'Buyer asked to cancel', OTHER: 'Other' };
  const PAY_METHODS = { UPI: 'UPI', BANK: 'Bank transfer', LINK: 'Payment link' };
  const CLOSE_TEXT = {
    DECLINED: 'Offer declined', AUTO_DECLINED: 'Offer declined', EXPIRED: 'Offer expired',
    WITHDRAWN: 'Offer withdrawn', SOLD_OUT: 'This size sold out', LISTING_PAUSED: 'Listing paused by the seller',
    PRICE_DROPPED: 'Price dropped below the offer — buy at the new price', FIXED_PRICE: 'Seller switched to fixed price',
    LAPSED: 'Checkout window passed', PURCHASED: 'Purchased'
  };

  const err = (code, message) => ({ ok: false, code, message });
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const rupeesToPaise = (r) => Math.round(Number(r) * 100);
  const isInt = (n) => Number.isInteger(n);
  const values = (o) => Object.values(o || {});

  function newId(s, prefix) {
    s.seq = (s.seq || 0) + 1;
    return prefix + '_' + s.seq.toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function emptyState() {
    return {
      v: 2, seq: 0, clockOffsetMs: 0, orderSeq: 10000,
      users: {}, buyerProfiles: {}, sellers: {}, listings: {}, privateRules: {},
      negotiations: {}, reservations: {}, orders: {}, paymentProfiles: {}, dealCodes: {},
      likes: {}, saves: {}, follows: {}, comments: [], notifications: [],
      sessions: { buyer: null, seller: null }
    };
  }

  // ---------- lookups ----------
  const sellerOfUser = (s, userId) => values(s.sellers).find((x) => x.userId === userId) || null;
  const variantOf = (l, variantId) => (l.variants || []).find((v) => v.id === variantId) || null;
  const latest = (n) => n.offers[n.offers.length - 1];
  const sideOf = (by) => (by === 'BUYER' ? 'BUYER' : 'SELLER');
  const lastBySide = (n, side) => { for (let i = n.offers.length - 1; i >= 0; i--) if (sideOf(n.offers[i].by) === side) return n.offers[i]; return null; };

  function activeReservations(s, variantId, now) {
    return values(s.reservations).filter((r) => r.variantId === variantId && r.status === 'ACTIVE' && r.expiresAt > now).length;
  }
  function available(s, l, v, now) { return Math.max(0, v.stock - activeReservations(s, v.id, now)); }

  function notify(s, userId, app, text, ref, now) {
    s.notifications.unshift({ id: newId(s, 'nt'), userId, app, text, ref: ref || null, at: now, read: false });
    if (s.notifications.length > 300) s.notifications.length = 300;
  }
  function event(n, type, actor, now, data) { n.events.push(Object.assign({ type, actor, at: now }, data || {})); }

  function closeNeg(s, n, offerStatus, reason, now, actor) {
    const last = latest(n);
    if (last && last.status === 'PENDING') { last.status = offerStatus; last.resolvedAt = now; }
    n.status = 'CLOSED'; n.closeReason = reason; n.closedAt = now; n.updatedAt = now;
    event(n, 'CLOSED', actor || 'SYSTEM', now, { reason });
  }

  function invalidateOpen(s, pred, reason, now) {
    values(s.negotiations).forEach((n) => {
      if (n.status !== 'OPEN' || !pred(n)) return;
      const l = s.listings[n.listingId];
      closeNeg(s, n, 'INVALIDATED', reason, now);
      notify(s, n.buyerId, 'buyer', `${CLOSE_TEXT[reason]}: ${l.title}`, { type: 'negotiation', id: n.id }, now);
      notify(s, l.ownerUserId, 'seller', `Offer closed (${CLOSE_TEXT[reason].toLowerCase()}): ${l.title}`, { type: 'negotiation', id: n.id }, now);
    });
  }
  function invalidateIfSoldOut(s, l, v, now, exceptId) {
    if (available(s, l, v, now) > 0) return;
    invalidateOpen(s, (n) => n.variantId === v.id && n.id !== exceptId, 'SOLD_OUT', now);
  }

  // ---------- negotiation core ----------
  function addOffer(s, n, by, amount, now, l) {
    const prev = latest(n);
    if (prev && prev.status === 'PENDING') { prev.status = 'COUNTERED'; prev.resolvedAt = now; }
    const offer = { id: newId(s, 'of'), by, amount, status: 'PENDING', at: now, expiresAt: now + l.bargaining.expiryHours * HOUR };
    n.offers.push(offer); n.updatedAt = now;
    event(n, prev ? 'COUNTERED' : 'OFFERED', by, now, { amount });
    return offer;
  }

  function acceptLatest(s, n, actor, now, opts) {
    opts = opts || {};
    const l = s.listings[n.listingId]; const v = variantOf(l, n.variantId); const last = latest(n);
    if (!last || last.status !== 'PENDING') return err('NOTHING_TO_ACCEPT', 'There is no open offer to accept.');
    const website = channelOf(l) === 'WEBSITE';
    let dealAccess = null;
    if (website) {
      dealAccess = opts.dealAccess || (sideOf(last.by) === 'SELLER' ? last.dealAccess : null);
      if (!dealAccess) return err('DEAL_ACCESS_REQUIRED', 'Add the coupon code or discount link that gives this price on your website.');
    }
    if (available(s, l, v, now) < 1) return err('OUT_OF_STOCK', 'This size is out of stock, so the offer can’t be accepted.');
    const res = { id: newId(s, 'rs'), listingId: l.id, variantId: v.id, negotiationId: n.id, reason: 'AGREEMENT', status: 'ACTIVE', createdAt: now, expiresAt: now + RULES.CHECKOUT_WINDOW_HOURS * HOUR };
    s.reservations[res.id] = res;
    last.status = 'ACCEPTED'; last.resolvedAt = now;
    const price = opts.price || last.amount;
    n.status = 'AGREED'; n.updatedAt = now;
    n.agreement = { price, deadline: res.expiresAt, reservationId: res.id, acceptedBy: actor, at: now, dealAccess };
    event(n, 'ACCEPTED', actor, now, { amount: price });
    const auto = actor === 'SYSTEM' ? ' (automatic response set by the seller)' : '';
    if (sideOf(actor) === 'SELLER') notify(s, n.buyerId, 'buyer', `Offer accepted${auto}: ${l.title} at ${fmt(price)}. Buy before the checkout window closes.`, { type: 'negotiation', id: n.id }, now);
    else notify(s, n.buyerId, 'buyer', `You accepted ${fmt(last.amount)} for ${l.title}. Checkout is open for ${RULES.CHECKOUT_WINDOW_HOURS} h.`, { type: 'negotiation', id: n.id }, now);
    notify(s, l.ownerUserId, 'seller', actor === 'SYSTEM' ? `Auto-accepted ${fmt(price)} for ${l.title} (${v.label}). 1 unit reserved.` : sideOf(actor) === 'BUYER' ? `Buyer accepted your ${fmt(last.amount)} counter for ${l.title}. 1 unit reserved.` : `You accepted ${fmt(last.amount)} for ${l.title}. 1 unit reserved.`, { type: 'negotiation', id: n.id }, now);
    invalidateIfSoldOut(s, l, v, now, n.id);
    return { ok: true };
  }

  function validateCounter(n, side, amount, l, opts) {
    const last = latest(n);
    if (n.status !== 'OPEN' || !last || last.status !== 'PENDING') return err('NOT_OPEN', 'This negotiation is no longer open.');
    if (sideOf(last.by) === side) return err('NOT_YOUR_TURN', 'Wait for the other side to respond.');
    if (n.offers.length >= RULES.MAX_OFFERS_PER_NEGOTIATION) return err('TURN_LIMIT', 'This negotiation has reached its limit. Accept or decline the last offer.');
    if (!isInt(amount) || amount <= 0) return err('INVALID_AMOUNT', 'Enter an amount in whole rupees.');
    if (amount >= l.price) return err('AT_OR_ABOVE_LIST', 'Counters must be below the listed price.');
    const mine = lastBySide(n, side);
    if (side === 'BUYER') {
      if (mine && amount <= mine.amount) return err('MUST_INCREASE', `Your counter must be higher than your last offer (${fmt(mine.amount)}).`);
      if (amount >= last.amount) return err('ACCEPT_INSTEAD', `That’s at or above the seller’s ${fmt(last.amount)} — accept it instead.`);
    } else {
      if (mine && (opts && opts.allowHold ? amount > mine.amount : amount >= mine.amount)) return err('MUST_DECREASE', `Your counter must be lower than your last counter (${fmt(mine.amount)}).`);
      if (amount <= last.amount) return err('ACCEPT_INSTEAD', `That’s at or below the buyer’s ${fmt(last.amount)} — accept it instead.`);
    }
    return { ok: true };
  }

  // Seller-controlled private rules, evaluated only on the server side (R8). Never serialised to buyers.
  function applyAutomation(s, n, now) {
    const l = s.listings[n.listingId]; const last = latest(n);
    if (n.status !== 'OPEN' || last.by !== 'BUYER' || last.status !== 'PENDING') return;
    const r = s.privateRules[l.id] || {};
    const website = channelOf(l) === 'WEBSITE'; const codes = s.dealCodes[l.id] || {};
    if (r.autoAcceptAt != null && last.amount >= r.autoAcceptAt) {
      // Website listings: the agreed price is the price the seller's pre-set code gives (the auto-accept amount).
      const opts = website ? { price: r.autoAcceptAt, dealAccess: codes.accept } : {};
      if ((!website || codes.accept) && acceptLatest(s, n, 'SYSTEM', now, opts).ok) return;
    }
    if (r.autoDeclineBelow != null && last.amount < r.autoDeclineBelow) { last.autoDeclineAt = now + RULES.AUTO_DECLINE_DELAY_MS; return; }
    // Auto-counter: applies to every buyer offer below the seller's minimum, after a short delay.
    // The seller holds at their counter (never goes up); if they countered lower by hand, that lower amount is repeated.
    if (r.autoCounterAt != null && (!website || codes.counter)) {
      const prev = lastBySide(n, 'SELLER');
      const amt = prev ? Math.min(r.autoCounterAt, prev.amount) : r.autoCounterAt;
      if (amt > last.amount && validateCounter(n, 'SELLER', amt, l, { allowHold: true }).ok) {
        last.systemCounterDueAt = now + RULES.AUTO_COUNTER_DELAY_MS; last.systemCounterAmount = amt;
        return;
      }
    }
    notify(s, l.ownerUserId, 'seller', `New offer ${fmt(last.amount)} for ${l.title} (${variantOf(l, n.variantId).label}). Reply before it expires.`, { type: 'negotiation', id: n.id }, now);
  }

  // ---------- sweep: expiry, delayed auto-decline, lapsed agreements (R7, R8, R9) ----------
  function sweep(s, now) {
    let changed = false;
    values(s.negotiations).forEach((n) => {
      const l = s.listings[n.listingId];
      if (n.status === 'OPEN') {
        const last = latest(n);
        if (last.status !== 'PENDING') return;
        if (last.systemCounterDueAt && now >= last.systemCounterDueAt) {
          const amt = last.systemCounterAmount, due = last.systemCounterDueAt;
          delete last.systemCounterDueAt; delete last.systemCounterAmount;
          const r = s.privateRules[l.id] || {}; const codes = s.dealCodes[l.id] || {}; const prev = lastBySide(n, 'SELLER');
          if (validateCounter(n, 'SELLER', amt, l, { allowHold: true }).ok) {
            const o = addOffer(s, n, 'SYSTEM', amt, due, l);
            if (channelOf(l) === 'WEBSITE') o.dealAccess = amt === r.autoCounterAt ? codes.counter : (prev && prev.dealAccess) || codes.counter;
            notify(s, n.buyerId, 'buyer', `Seller countered ${fmt(amt)} for ${l.title}.`, { type: 'negotiation', id: n.id }, due);
            notify(s, l.ownerUserId, 'seller', `Auto-countered ${fmt(amt)} on a ${fmt(last.amount)} offer for ${l.title}.`, { type: 'negotiation', id: n.id }, due);
          } else notify(s, l.ownerUserId, 'seller', `New offer ${fmt(last.amount)} for ${l.title}. Reply before it expires.`, { type: 'negotiation', id: n.id }, due);
          changed = true; return;
        }
        if (last.autoDeclineAt && now >= last.autoDeclineAt) {
          closeNeg(s, n, 'DECLINED', 'AUTO_DECLINED', now, 'SYSTEM');
          notify(s, n.buyerId, 'buyer', `The seller declined your ${fmt(last.amount)} offer for ${l.title} (automatic response set by the seller).`, { type: 'negotiation', id: n.id }, now);
          notify(s, l.ownerUserId, 'seller', `Auto-declined a ${fmt(last.amount)} offer for ${l.title}.`, { type: 'negotiation', id: n.id }, now);
          changed = true;
        } else if (now >= last.expiresAt) {
          closeNeg(s, n, 'EXPIRED', 'EXPIRED', now);
          notify(s, n.buyerId, 'buyer', `Offer expired: ${l.title} (${fmt(last.amount)}).`, { type: 'negotiation', id: n.id }, now);
          notify(s, l.ownerUserId, 'seller', `Offer expired without a reply: ${l.title} (${fmt(last.amount)}).`, { type: 'negotiation', id: n.id }, now);
          changed = true;
        }

        const r = s.reservations[n.agreement.reservationId]; if (r && r.status === 'ACTIVE') r.status = 'RELEASED';
        n.status = 'LAPSED'; n.closeReason = 'LAPSED'; n.updatedAt = now; event(n, 'LAPSED', 'SYSTEM', now);
        notify(s, n.buyerId, 'buyer', `Your agreed price for ${l.title} lapsed — the checkout window closed.`, { type: 'negotiation', id: n.id }, now);
        notify(s, l.ownerUserId, 'seller', `Buyer didn’t check out in time: ${l.title}. Reserved unit released.`, { type: 'negotiation', id: n.id }, now);
        changed = true;
      }
    });

    values(s.orders).forEach((o) => {
      if (o.status === 'PLACED' && o.confirmBy && now >= o.confirmBy) {
        o.status = 'EXPIRED'; o.events.push({ status: 'EXPIRED', at: now }); restock(s, o);
        notify(s, o.buyerId, 'buyer', `Order ${o.number} expired: the seller didn’t confirm it within ${RULES.ORDER_CONFIRM_WINDOW_HOURS} h. Contact the seller if you already paid.`, { type: 'order', id: o.id }, now);
        notify(s, o.sellerUserId, 'seller', `Order ${o.number} expired because it wasn’t confirmed in time. This shows on your shop record.`, { type: 'order', id: o.id }, now);
        changed = true;
      }
    });
    return changed;
  }

  // ---------- validation helpers ----------
  const normPhone = (p) => String(p || '').replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '');
  const PHONE_RE = /^[6-9]\d{9}$/;
  const PIN_RE = /^[1-9]\d{5}$/;
  const GSTIN_RE = /^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
  const HANDLE_RE = /^[a-z0-9_.]{3,24}$/;
  const UPI_RE = /^[a-zA-Z0-9.\-_]{2,256}@[a-zA-Z][a-zA-Z0-9]{1,63}$/;
  const IFSC_RE = /^[A-Z]{4}0[A-Z0-9]{6}$/;
  const ACCT_RE = /^\d{9,18}$/;
  const CODE_RE = /^[A-Za-z0-9_-]{3,40}$/;
  const isHttps = (u) => { try { const x = new URL(String(u)); return x.protocol === 'https:' && !!x.hostname && x.hostname.includes('.'); } catch (e) { return false; } };
  const channelOf = (l) => (l.checkout && l.checkout.channel) || 'DIRECT';

  function cleanPayment(p) {
    p = p || {};
    const t = (x) => String(x == null ? '' : x).trim();
    return { upiId: t(p.upiId) || null, upiQrMediaId: p.upiQrMediaId || null, bankHolder: t(p.bankHolder) || null, bankAccount: t(p.bankAccount).replace(/\s/g, '') || null, bankIfsc: t(p.bankIfsc).toUpperCase() || null, bankName: t(p.bankName) || null, paymentLink: t(p.paymentLink) || null, website: t(p.website) || null };
  }
  function validatePayment(p) {
    const e = {}; const c = cleanPayment(p);
    if (c.upiId && !UPI_RE.test(c.upiId)) e.upiId = 'Enter a UPI ID like name@okbank.';
    const anyBank = c.bankHolder || c.bankAccount || c.bankIfsc || c.bankName;
    if (anyBank) {
      if (!c.bankHolder || c.bankHolder.length < 2) e.bankHolder = 'Enter the account holder’s name.';
      if (!ACCT_RE.test(c.bankAccount || '')) e.bankAccount = 'Enter a 9–18 digit account number.';
      if (!IFSC_RE.test(c.bankIfsc || '')) e.bankIfsc = 'Enter an 11-character IFSC, like HDFC0001234.';
    }
    if (c.paymentLink && !isHttps(c.paymentLink)) e.paymentLink = 'Enter a full https:// payment link.';
    if (c.website && !isHttps(c.website)) e.website = 'Enter a full https:// website address.';
    if (!c.upiId && !c.upiQrMediaId && !anyBank && !c.paymentLink && !c.website) e.payment = 'Add at least one way for buyers to pay you, or your website.';
    return { errors: e, clean: c };
  }
  const directMethods = (p) => { const m = []; if (!p) return m; if (p.upiId || p.upiQrMediaId) m.push('UPI'); if (p.bankAccount) m.push('BANK'); if (p.paymentLink) m.push('LINK'); return m; };
  function validateDealAccess(d, label) {
    if (!d || !d.value || !String(d.value).trim()) return label + ': enter a coupon code or a discount link.';
    if (d.type === 'LINK') return isHttps(d.value) ? null : label + ': enter a full https:// link.';
    if (d.type === 'CODE') return CODE_RE.test(String(d.value).trim()) ? null : label + ': codes use 3–40 letters, numbers, - or _.';
    return label + ': choose code or link.';
  }
  const cleanDeal = (d) => (d ? { type: d.type, value: String(d.value).trim() } : null);
  const hasShipment = (x) => !!(x && ['carrier', 'trackingId', 'trackingUrl', 'expectedDate', 'note'].some((k) => String(x[k] || '').trim()));
  function validateShipment(x) {
    const t = (k) => String(x[k] || '').trim(); const f = {};
    const clean = { carrier: t('carrier').slice(0, 60) || null, trackingId: t('trackingId').slice(0, 60) || null, trackingUrl: t('trackingUrl') || null, expectedDate: t('expectedDate') || null, note: t('note').slice(0, 200) || null };
    if (!hasShipment(x)) f.shipment = 'Add a courier, tracking number, link or a note such as “hand delivery”.';
    if (clean.trackingUrl && !isHttps(clean.trackingUrl)) f.trackingUrl = 'Enter a full https:// tracking link.';
    if (clean.expectedDate && !/^\d{4}-\d{2}-\d{2}$/.test(clean.expectedDate)) f.expectedDate = 'Use a date like 2026-11-04.';
    return Object.keys(f).length ? { fields: f } : { clean };
  }
  function restock(s, o) { const l = s.listings[o.listingId]; const v = l && variantOf(l, o.variantId); if (v && !o.restocked) { v.stock += 1; o.restocked = true; } }

  function validateAddress(a) {
    const e = {};
    if (!a || !String(a.name || '').trim() || String(a.name).trim().length < 2) e.name = 'Enter the recipient’s name.';
    if (!String(a?.line1 || '').trim()) e.line1 = 'Enter flat, house or building.';
    if (!String(a?.line2 || '').trim()) e.line2 = 'Enter area or street.';
    if (!PIN_RE.test(String(a?.pin || ''))) e.pin = 'Enter a 6-digit PIN code.';
    if (!String(a?.city || '').trim()) e.city = 'Enter the city.';
    if (!String(a?.state || '').trim()) e.state = 'Enter the state.';
    return e;
